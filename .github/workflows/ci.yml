name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Nightly: re-scan main against newly-disclosed CVEs (a CVSS>=7 advisory can
  # land against unchanged dependencies any day) and keep the NVD cache warm so
  # weekday pushes stay fast. Does not deploy — deploy.yml triggers on tags only.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  # Supply-chain guardrail: every third-party action invoked in the .github/
  # workflows tree must reference a commit SHA, not a mutable tag. Action
  # maintainers can force-push tags; SHAs are immutable. actions/* and
  # github/* are explicitly allowed by tag because they're maintained by
  # GitHub itself and have additional protections; everything else needs
  # the @<sha> form with the version pinned in a trailing comment.
  pin-check:
    name: Action Pin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify third-party actions are pinned by SHA
        run: |
          set -euo pipefail
          mapfile -t bad < <(grep -RhnE '^[[:space:]]*-?[[:space:]]*uses: ' .github/workflows \
            | grep -vE 'uses: actions/' \
            | grep -vE 'uses: github/' \
            | grep -vE 'uses: \./' \
            | grep -vE 'uses: [^@]+@[a-f0-9]{40}( |$)') || true
          if [ ${#bad[@]} -gt 0 ]; then
            echo "::error::The following 'uses:' references are not SHA-pinned:"
            printf '  %s\n' "${bad[@]}"
            exit 1
          fi
          echo "All third-party actions are SHA-pinned"

  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # OWASP Dependency-Check moved to the dedicated `dependency-scan` job so it
      # runs in PARALLEL with these tests instead of serializing the multi-minute
      # NVD scan here. Plain `verify` does NOT run the scan: the check binds to
      # `verify` only via the `dep-scan` profile (pom.xml), omitted on purpose.
      - name: Run tests
        run: ./mvnw -B verify

      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: false

      - name: Upload coverage to DeepSource
        if: always()
        continue-on-error: true
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
        run: |
          if [ -z "$DEEPSOURCE_DSN" ]; then
            echo "DEEPSOURCE_DSN not set, skipping"
            exit 0
          fi
          curl -sSL https://deepsource.io/cli | sh
          ./bin/deepsource report --analyzer test-coverage --key java --value-file target/site/jacoco/jacoco.xml

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  dependency-scan:
    name: Dependency Scan (OWASP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # The NVD H2 database gets its OWN cache, keyed on the ISO week and NOT on
      # the pom.xml hash. setup-java's `cache: maven` is keyed on the pom hash,
      # so a dependency bump (when the scan matters most) used to bust the NVD DB
      # and force a full multi-hundred-MB re-download. restore-keys falls back to
      # the most recent week, so we only ever pull a small incremental NVD delta.
      # The week stamp is computed in its own step and referenced by output —
      # never inline a self-referencing env, or the cache silently never restores.
      - name: Compute NVD cache key (ISO week)
        id: nvdkey
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: .dependency-check/data
          key: nvd-data-v12-${{ steps.nvdkey.outputs.week }}
          restore-keys: |
            nvd-data-v12-

      # Same gate as before: the `dep-scan` profile binds OWASP Dependency-Check
      # to `verify`, and failBuildOnCVSS=7 fails the build on any CVSS>=7 CVE.
      # -DskipTests because the `test` job already runs them. This job stays in
      # the SAME ci.yml run, so deploy.yml's verify-ci (whole-run == success)
      # still blocks deploy on a dependency CVE — the security gate is unchanged.
      - name: OWASP Dependency-Check (CVSS >= 7 fails the build)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -Pdep-scan -DskipTests verify

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [ test ]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Daily token so the Dockerfile's apt-get upgrade layer re-runs with fresh
      # metadata, keeping OS security patches current (see Dockerfile comment).
      - name: Compute apt cache-bust date
        id: aptdate
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: portfolio-blog-backend:${{ github.sha }}
          build-args: |
            NEXUS_HOST=${{ secrets.NEXUS_HOST }}
            PLAYWRIGHT_REMOTE=true
            APT_SECURITY_REFRESH=${{ steps.aptdate.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portfolio-blog-backend:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: 'true'
          exit-code: '1'

      # SBOM generation. Builds a CycloneDX-flavored bill of materials for the
      # backend image. The deploy workflow signs and attests this alongside
      # the image with cosign, which gives downstream consumers a verifiable
      # dependency manifest.
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          image: portfolio-blog-backend:${{ github.sha }}
          format: 'cyclonedx-json'
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 30

      - name: Upload SARIF scan results to GitHub Security
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portfolio-blog-backend:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
