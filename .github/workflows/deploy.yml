name: Build & Deploy to Production

on:
  # Auto-deploy after CI passes on main
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual deploy with optional SHA override
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (leave empty for latest main)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/vunter/portfolio-blog-api
  FE_IMAGE: ghcr.io/vunter/portfolio-blog-frontend
  NEXUS_URL: https://vunter.tplinkdns.com/nexus
  CONFIG_REPO: builds

jobs:
  # ──────────────────────────────────────────────
  # Resolve the commit SHA to build & deploy
  # ──────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      sha_short: ${{ steps.sha.outputs.sha_short }}
    steps:
      - name: Resolve deploy SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ github.event.inputs.sha || github.sha }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Deploying SHA: $SHA"

  # ──────────────────────────────────────────────
  # Build API image → push to GHCR
  # ──────────────────────────────────────────────
  build-api:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ needs.prepare.outputs.sha }}
          build-args: NEXUS_HOST=${{ secrets.NEXUS_HOST }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ──────────────────────────────────────────────
  # Build Frontend image → push to GHCR
  # ──────────────────────────────────────────────
  build-frontend:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: vunter/portfolio-blog-frontend
          ref: main

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.FE_IMAGE }}:latest
            ${{ env.FE_IMAGE }}:${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ──────────────────────────────────────────────
  # Bundle config files → upload to Nexus
  # ──────────────────────────────────────────────
  bundle-config:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Create config bundle
        run: |
          SHA="${{ needs.prepare.outputs.sha }}"
          BUNDLE="portfolio-blog-config-${SHA}.tar.gz"

          # Bundle only deployment config — no source code
          FILES=(
            deploy/cloud/docker-compose.cloud.yml
            deploy/cloud/docker-compose.infra.yml
            deploy/cloud/nginx-cloud.conf
            deploy/cloud/rollback.sh
            deploy/cloud/init-db.sh
            nginx/
            prometheus.yml
          )

          # Include optional directories if present
          [ -d "deploy/cloud/scripts" ] && FILES+=(deploy/cloud/scripts/)
          [ -d "prometheus" ] && FILES+=(prometheus/)

          tar czf "$BUNDLE" "${FILES[@]}"
          echo "Config bundle: $BUNDLE ($(du -h $BUNDLE | cut -f1))"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"

      - name: Upload config bundle to Nexus
        run: |
          SHA="${{ needs.prepare.outputs.sha }}"
          UPLOAD_URL="${{ env.NEXUS_URL }}/repository/${{ env.CONFIG_REPO }}/portfolio-blog/config/${BUNDLE}"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}" \
            --upload-file "$BUNDLE" \
            "$UPLOAD_URL")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Uploaded config bundle to Nexus (HTTP $HTTP_CODE)"
          else
            echo "Failed to upload config bundle (HTTP $HTTP_CODE)"
            exit 1
          fi

          # Also upload as 'latest' for easy access
          LATEST_URL="${{ env.NEXUS_URL }}/repository/${{ env.CONFIG_REPO }}/portfolio-blog/config/portfolio-blog-config-latest.tar.gz"
          curl -s -o /dev/null \
            -u "${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}" \
            --upload-file "$BUNDLE" \
            "$LATEST_URL"

  # ──────────────────────────────────────────────
  # Build JAR → publish to Nexus with timestamp
  # ──────────────────────────────────────────────
  publish-jar:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build JAR (skip tests)
        run: |
          chmod +x mvnw
          MAVEN_SETTINGS=""
          if [ -n "${{ secrets.NEXUS_HOST }}" ]; then
            sed -i "s|__NEXUS_HOST__|${{ secrets.NEXUS_HOST }}|g" .mvn/nexus-settings.xml
            MAVEN_SETTINGS="-s .mvn/nexus-settings.xml"
          fi
          ./mvnw clean package -Dmaven.test.skip=true -B $MAVEN_SETTINGS

      - name: Upload JAR to Nexus
        run: |
          JAR_FILE=$(ls target/*.jar | grep -v original | head -1)
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          SHA_SHORT="${{ needs.prepare.outputs.sha_short }}"
          JAR_NAME="portfolio-blog-api-${TIMESTAMP}-${SHA_SHORT}.jar"
          NEXUS_AUTH="${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}"
          FILE_SIZE=$(stat -c%s "$JAR_FILE")
          FILE_SIZE_MB=$((FILE_SIZE / 1024 / 1024))

          # Monitors a background curl upload using /proc/PID/fdinfo to track read position
          upload_with_progress() {
            local URL="$1" LABEL="$2"
            curl -s -o /dev/null -w "%{http_code}" \
              -u "$NEXUS_AUTH" \
              --upload-file "$JAR_FILE" \
              "$URL" > /tmp/upload_code &
            local PID=$!
            local START=$(date +%s)

            echo "📤 ${LABEL}: 0/${FILE_SIZE_MB}MB"
            while kill -0 $PID 2>/dev/null; do
              sleep 15
              local NOW=$(date +%s) ELAPSED=$(($(date +%s) - START)) SENT=0
              for fd_path in /proc/$PID/fdinfo/*; do
                local fd_num=$(basename "$fd_path")
                local fd_target=$(readlink "/proc/$PID/fd/$fd_num" 2>/dev/null || true)
                if echo "$fd_target" | grep -q "\.jar"; then
                  SENT=$(awk '/^pos:/{print $2}' "$fd_path" 2>/dev/null || echo 0)
                  break
                fi
              done
              if [ "$SENT" -gt 0 ] && [ "$ELAPSED" -gt 0 ]; then
                local PCT=$((SENT * 100 / FILE_SIZE))
                local SENT_MB=$((SENT / 1024 / 1024))
                local AVG_BPS=$((SENT / ELAPSED))
                if [ "$AVG_BPS" -gt 0 ]; then
                  local REM=$(( (FILE_SIZE - SENT) / AVG_BPS ))
                  local SPEED_KB=$((AVG_BPS / 1024))
                  echo "📤 ${LABEL}: ${PCT}% (${SENT_MB}/${FILE_SIZE_MB}MB) — ${SPEED_KB} KB/s — ETA: $((REM/60))m$((REM%60))s"
                else
                  echo "📤 ${LABEL}: ${PCT}% (${SENT_MB}/${FILE_SIZE_MB}MB)"
                fi
              else
                echo "⏳ ${LABEL}: waiting for data... ${ELAPSED}s elapsed"
              fi
            done
            wait $PID
            local TOTAL=$(( $(date +%s) - START ))
            local HTTP_CODE=$(cat /tmp/upload_code)
            echo "✅ ${LABEL}: done in $((TOTAL/60))m$((TOTAL%60))s (HTTP ${HTTP_CODE})"
            return $([ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] && echo 0 || echo 1)
          }

          UPLOAD_URL="${{ env.NEXUS_URL }}/repository/${{ env.CONFIG_REPO }}/portfolio-blog/jars/${JAR_NAME}"
          upload_with_progress "$UPLOAD_URL" "${JAR_NAME}" || { echo "❌ Failed to upload JAR"; exit 1; }

          LATEST_URL="${{ env.NEXUS_URL }}/repository/${{ env.CONFIG_REPO }}/portfolio-blog/jars/portfolio-blog-api-latest.jar"
          upload_with_progress "$LATEST_URL" "latest.jar" || true

      - name: Cleanup old JARs (keep 5 days)
        continue-on-error: true
        run: |
          NEXUS_URL="${{ env.NEXUS_URL }}"
          NEXUS_AUTH="${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }}"
          CUTOFF=$(date -u -d '5 days ago' +%Y-%m-%dT%H:%M:%S)

          echo "Cleaning up JARs older than ${CUTOFF}"

          # Paginate through all JAR assets in the builds repo
          CONTINUATION=""
          DELETED=0
          while true; do
            if [ -n "$CONTINUATION" ]; then
              RESPONSE=$(curl -s -u "$NEXUS_AUTH" \
                "${NEXUS_URL}/service/rest/v1/search/assets?repository=builds&group=/portfolio-blog/jars&continuationToken=${CONTINUATION}")
            else
              RESPONSE=$(curl -s -u "$NEXUS_AUTH" \
                "${NEXUS_URL}/service/rest/v1/search/assets?repository=builds&group=/portfolio-blog/jars")
            fi

            # Process each asset
            echo "$RESPONSE" | jq -r '.items[] | select(.path | endswith("-latest.jar") | not) | "\(.id) \(.blobCreated)"' 2>/dev/null | while read -r ASSET_ID BLOB_DATE; do
              BLOB_DATE_TRIMMED=$(echo "$BLOB_DATE" | cut -d'+' -f1 | cut -d'.' -f1)
              if [[ "$BLOB_DATE_TRIMMED" < "$CUTOFF" ]]; then
                echo "Deleting old JAR: $ASSET_ID (created: $BLOB_DATE_TRIMMED)"
                curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                  -u "$NEXUS_AUTH" \
                  "${NEXUS_URL}/service/rest/v1/assets/${ASSET_ID}"
                DELETED=$((DELETED + 1))
              fi
            done

            # Check for next page
            CONTINUATION=$(echo "$RESPONSE" | jq -r '.continuationToken // empty')
            if [ -z "$CONTINUATION" ]; then
              break
            fi
          done
          echo "Cleanup complete (deleted ${DELETED} old JARs)"

  # ──────────────────────────────────────────────
  # Deploy to production (no source code on server)
  # ──────────────────────────────────────────────
  deploy:
    needs: [prepare, build-api, build-frontend, bundle-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://catananti.dev
    steps:
      - name: Deploy on Droplet
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ needs.prepare.outputs.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_URL: ${{ env.NEXUS_URL }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: vunter
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA,GHCR_TOKEN,NEXUS_USER,NEXUS_PASSWORD,NEXUS_URL
          command_timeout: 10m
          script: |
            set -e
            source ~/.doppler_token

            DEPLOY_DIR="$HOME/portfolio-blog"
            BUNDLE_NAME="portfolio-blog-config-${DEPLOY_SHA}.tar.gz"
            BUNDLE_URL="${NEXUS_URL}/repository/builds/portfolio-blog/config/${BUNDLE_NAME}"

            echo "=== Downloading config bundle from Nexus ==="
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            HTTP_CODE=$(curl -s -o "$BUNDLE_NAME" -w "%{http_code}" \
              -u "${NEXUS_USER}:${NEXUS_PASSWORD}" \
              "$BUNDLE_URL")

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Downloaded config bundle (HTTP $HTTP_CODE)"
            else
              echo "Failed to download config from Nexus (HTTP $HTTP_CODE), aborting"
              rm -f "$BUNDLE_NAME"
              exit 1
            fi

            echo "=== Extracting config bundle ==="
            tar xzf "$BUNDLE_NAME" --overwrite
            rm -f "$BUNDLE_NAME"

            echo "=== Pulling images from GHCR ==="
            echo "$GHCR_TOKEN" | docker login ghcr.io -u github-actions --password-stdin
            docker pull ghcr.io/vunter/portfolio-blog-api:${DEPLOY_SHA}
            docker pull ghcr.io/vunter/portfolio-blog-frontend:${DEPLOY_SHA}
            docker tag ghcr.io/vunter/portfolio-blog-api:${DEPLOY_SHA} portfolio-blog-api:latest
            docker tag ghcr.io/vunter/portfolio-blog-frontend:${DEPLOY_SHA} portfolio-blog-frontend:latest

            cd deploy/cloud

            echo "=== Ensuring infrastructure ==="
            if docker ps -q -f name=blog-postgres -f status=running | grep -q .; then
              echo "Infrastructure already running"
            else
              echo "Starting infrastructure stack..."
              doppler run -- docker compose -p blog-infra -f docker-compose.infra.yml up -d
              echo "Waiting for infrastructure health..."
              sleep 10
            fi
            docker exec blog-postgres pg_isready -d blog || sleep 10

            echo "=== Deploying (zero-downtime rolling recreate) ==="
            doppler run -- docker compose -f docker-compose.cloud.yml up -d --force-recreate --remove-orphans
            docker image prune -f

            echo "=== Health check ==="
            for i in $(seq 1 30); do
              if docker exec portfolio-blog-api wget -q --spider http://localhost:8080/actuator/health/readiness 2>/dev/null; then
                echo "API healthy after ${i} attempts"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "API failed health check after 30 attempts"
                docker logs portfolio-blog-api --tail 50
                exit 1
              fi
              sleep 3
            done

            echo "=== Smoke tests ==="
            curl -sf http://localhost:80/api/v1/languages > /dev/null || { echo "Languages endpoint failed"; exit 1; }
            curl -sf http://localhost:80/ > /dev/null || { echo "Frontend failed"; exit 1; }
            echo "All smoke tests passed"

            echo "${DEPLOY_SHA}" > ~/portfolio-blog/.last-deploy-sha
            echo "Deploy complete at $(date) — SHA: ${DEPLOY_SHA}"

      - name: Notify deploy status
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome || job.status }}
          DEPLOY_SHA: ${{ needs.prepare.outputs.sha_short }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No Discord webhook configured, skipping"
            exit 0
          fi
          if [ "$DEPLOY_STATUS" = "success" ]; then
            COLOR=3066993; TITLE="Deploy Succeeded"
          else
            COLOR=15158332; TITLE="Deploy Failed"
          fi
          curl -sf -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"$TITLE\",
              \"color\": $COLOR,
              \"fields\": [
                {\"name\": \"Commit\", \"value\": \"\`${DEPLOY_SHA}\`\", \"inline\": true},
                {\"name\": \"Actor\", \"value\": \"${{ github.actor }}\", \"inline\": true},
                {\"name\": \"Run\", \"value\": \"[#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"inline\": true}
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "$DISCORD_WEBHOOK" || echo "Discord notification failed (non-critical)"
