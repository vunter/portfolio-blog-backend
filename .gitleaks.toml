title = "gitleaks config"

# Extends the bundled default ruleset. The CI "Secret Scan" job scans the full
# git history (fetch-depth: 0), so historical commits are scanned too. The
# allowlist below covers paths that only ever hold non-secret values:
#   - test fixtures: dummy keys/secrets hard-coded in *Test.java
#   - i18n bundles: the word "LinkedIn" trips the linkedin-client-id rule
#   - .env.example: placeholders incl. Google's PUBLIC reCAPTCHA test keys
# Real secrets are sourced at runtime via Vault / Doppler and never committed.

[extend]
useDefault = true

[allowlist]
description = "Test fixtures, i18n bundles, and .env.example placeholders (no real secrets)"
paths = [
  '''src/test/java/''',
  '''src/main/resources/messages_''',
  '''\.env\.example''',
]
