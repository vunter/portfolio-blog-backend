# ==================== QA PROFILE ====================
# Baseline igual a prod, com Vault DESATIVADO (Doppler é a fonte de segredos em QA).
# Valores específicos de QA (URLs, DB target) vêm via env vars do Doppler.

# === Vault: desativado em QA (segredos via Doppler env vars) ===
spring.cloud.vault.enabled=false

# Swagger/OpenAPI — desabilitado em QA (igual prod)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Logging
# Broad controller/service stay at INFO; raise a specific class to DEBUG
# temporarily during investigation (e.g. ...service.AuthService=DEBUG).
logging.level.root=WARN
logging.level.dev.catananti=INFO
logging.level.dev.catananti.controller=INFO
logging.level.dev.catananti.service=INFO
logging.level.dev.catananti.config.SecurityConfig=INFO

# CORS — AUD19C-6: two-layer defense like prod/cloud. The compose file also has a
# `:-` fallback; this property default covers runs outside compose. QA has no
# dedicated public origin documented, so the prod origins are the fallback.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://catananti.dev,https://www.catananti.dev}

# Cookie security
jwt.cookie.secure=true

# HSTS
security.hsts.enabled=true

# ==================== Datadog APM & Metrics ====================
management.datadog.metrics.export.enabled=${DD_METRICS_ENABLED:true}
management.datadog.metrics.export.api-key=${DD_API_KEY}
management.datadog.metrics.export.uri=${DD_METRICS_URI:https://api.us5.datadoghq.com}
management.datadog.metrics.export.step=30s
