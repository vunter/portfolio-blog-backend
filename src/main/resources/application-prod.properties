# ==================== PRODUCTION PROFILE ====================
# This file overrides application.properties for production deployments.
#
# M-16: KEEP IN SYNC WITH application-cloud.properties — that file is the
# source of truth for prod-grade overrides (actual production runs profile
# `cloud` via Doppler). The two profiles intentionally differ ONLY in secret
# sourcing: `prod` pulls secrets from Vault (spring.config.import=optional:vault://),
# `cloud` gets them injected as env vars by Doppler. Everything else below the
# Vault block mirrors cloud. We copy instead of `spring.config.import`-ing
# application-cloud.properties because imported documents take precedence over
# the importing one in Spring Boot, so cloud's `spring.cloud.vault.enabled=false`
# would clobber this profile's Vault configuration.

# === Vault: fail-fast in production (secrets MUST load) ===
spring.config.import=optional:vault://
spring.cloud.vault.enabled=true
spring.cloud.vault.fail-fast=true

# Swagger/OpenAPI — forcefully disabled in production (cannot be overridden by env var)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Logging — reduce verbosity in production. Broad controller/service stay at INFO;
# raise a specific class to DEBUG temporarily during investigation (e.g. ...service.AuthService=DEBUG).
logging.level.root=WARN
logging.level.dev.catananti=INFO
logging.level.dev.catananti.controller=INFO
logging.level.dev.catananti.service=INFO
logging.level.dev.catananti.config.SecurityConfig=INFO

# Cookie security — always true in production
jwt.cookie.secure=true

# HSTS — enabled in production
security.hsts.enabled=true

# reCAPTCHA — enforced on auth + contact endpoints
recaptcha.enabled=true

# === Cookie domain (copied from application-cloud.properties — see header) ===
jwt.cookie.domain=${JWT_COOKIE_DOMAIN:catananti.dev}

# === CORS: explicit prod override, no localhost fallback (copied from cloud) ===
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://catananti.dev,https://www.catananti.dev}

# === App URLs (copied from cloud) ===
app.url=${APP_URL:https://catananti.dev}
app.site-url=${APP_SITE_URL:https://catananti.dev}

# === Email overrides (copied from cloud) ===
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:465}
app.email.from=${MAIL_FROM:noreply@catananti.dev}
app.email.from-name=${MAIL_FROM_NAME:Catananti Portfolio}
app.email.support=${EMAIL_SUPPORT:admin@catananti.dev}
app.contact.notification-email=${CONTACT_NOTIFICATION_EMAIL:admin@catananti.dev}

# === Flyway: versioned DB migrations via JDBC (copied from cloud) ===
# Credentials reference spring.r2dbc.* (not raw env vars) so they resolve the
# same way the app's DB connection does — from Vault under `prod`, from
# Doppler-injected env vars if those are set.
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${FLYWAY_DB_HOST:blog-postgres}:5432/${FLYWAY_DB_NAME:blog}
spring.flyway.user=${spring.r2dbc.username}
spring.flyway.password=${spring.r2dbc.password}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ==================== Datadog APM & Metrics ====================
management.datadog.metrics.export.enabled=${DD_METRICS_ENABLED:true}
management.datadog.metrics.export.api-key=${DD_API_KEY}
management.datadog.metrics.export.uri=${DD_METRICS_URI:https://api.us5.datadoghq.com}
management.datadog.metrics.export.step=30s
