# ==================== LOCAL PROFILE ====================
# Runs locally against PostgreSQL + Redis on rpi5 K3s cluster.
# Secrets are pulled from HashiCorp Vault (AppRole auth).
# Only 2 env vars needed: VAULT_ROLE_ID and VAULT_SECRET_ID (from Doppler).

# === Vault: pull secrets from cluster Vault ===
spring.config.import=vault://
spring.cloud.vault.enabled=true
spring.cloud.vault.fail-fast=true

# Disable Docker Compose integration
spring.docker.compose.enabled=false

# Allow bean overriding
spring.main.allow-bean-definition-overriding=true

# Disable Datadog metrics locally
management.datadog.metrics.export.enabled=false
management.metrics.export.datadog.enabled=false

# Database — PostgreSQL on rpi5 K3s (NodePort 30432)
# Password resolved from Vault key: spring.r2dbc.password
spring.r2dbc.url=r2dbc:postgresql://192.168.1.235:30432/blog

# PostgreSQL schema — don't re-init (data already exists)
app.schema.init=false

# Flyway off in local — cluster Postgres is managed externally; enable per-developer if needed
spring.flyway.enabled=false

# Redis on rpi5 K3s (NodePort 30679).
# NOTE: this MUST stay `redis`. RedisConfig is @ConditionalOnProperty(spring.cache.type=redis)
# and is the only bean providing ReactiveRedisTemplate<String,String> named "reactiveRedisTemplate",
# which AnalyticsProofOfWorkService / AnalyticsTokenService / RateLimitingFilter require
# non-optionally. DevRedisConfig supplies it only for @Profile({"dev","e2e"}), so with
# `simple` the local profile fails to start outright (NoSuchBeanDefinitionException).
# Redis being unreachable at runtime is fine — those callers degrade via onErrorResume —
# but the bean must exist.
spring.cache.type=redis
spring.data.redis.host=192.168.1.235
spring.data.redis.port=30679
# Password resolved from Vault key (spring.data.redis.password) like the other
# cluster secrets; the env var is only a local override. Never commit the value.
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailHealthContributorAutoConfiguration

# Disable mail health indicator
management.health.mail.enabled=false

# JWT cookie settings (secrets from Vault: jwt.secret)
jwt.cookie.secure=false
jwt.cookie.domain=

# Enable PostgreSQL Full-Text Search
app.search.use-fts=true

# Logging
logging.level.root=INFO
logging.level.dev.catananti=DEBUG
logging.file.name=target/app.log

# CORS
cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# Disable scheduled tasks heavy polling
scheduling.refresh-token-cleanup-ms=3600000
scheduling.password-reset-cleanup-ms=21600000
scheduling.metrics-update-ms=300000
app.scheduler.article-publish-rate=300000
cache.warming.refresh-rate-ms=300000
cache.warming.enabled=false

# Enable Swagger UI
springdoc.swagger-ui.enabled=true

# Disable CSRF
security.csrf.enabled=false

# Actuator — the local profile targets the live cluster Postgres/Redis, so we do
# NOT expose env/loggers (which can leak resolved config) and only show health
# details to authorized callers. Broad exposure stays in the isolated dev profile.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# Override readiness group to exclude Redis
management.endpoint.health.group.readiness.include=readinessState,db

# Dev admin (secrets from Vault: admin.email, admin.password)
admin.name=${ADMIN_NAME:Dev Admin}
admin.user.initialization.enabled=false

# Contact form
app.contact.notification-email=${CONTACT_NOTIFICATION_EMAIL:dev@localhost}

# DeepL Translation API (from Vault: deepl.api-key)
