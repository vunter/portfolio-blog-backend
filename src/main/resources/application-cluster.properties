# ==================== CLUSTER PROFILE ====================
# Runs on default-server (192.168.1.214) via Docker Compose
# PostgreSQL on rpi5 K3s (192.168.1.235:30432), Redis on Docker network

# Disable Vault (ReactiveSessionManagerAdapter hangs with Spring Boot 4.0.2)
spring.cloud.vault.enabled=false
spring.config.import=

# Disable Docker Compose integration
spring.docker.compose.enabled=false

# Allow bean overriding
spring.main.allow-bean-definition-overriding=true

# Database — PostgreSQL on cluster NodePort (host/port externalized; see deploy env)
spring.r2dbc.url=r2dbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME:blog}
spring.r2dbc.username=${DATABASE_USERNAME:postgres}
spring.r2dbc.password=${DATABASE_PASSWORD}

# Schema already applied
app.schema.init=false

# Flyway
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME:blog}
spring.flyway.user=${DATABASE_USERNAME:postgres}
spring.flyway.password=${DATABASE_PASSWORD}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=4
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Redis — Docker network alias 'redis' (blog-redis container)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.cache.type=redis

# Q10.11: Exclude Sentry in cluster dev (no DSN needed)
spring.autoconfigure.exclude=io.sentry.spring.boot.SentryAutoConfiguration

# JWT
jwt.secret=${JWT_SECRET}
# SECURITY: this cookie carries the auth/session token. It defaults to false so login
# works over plain HTTP on the LAN, but MUST be set to true (JWT_COOKIE_SECURE=true)
# once TLS terminates at the cluster ingress — otherwise the session token is sent in cleartext.
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
jwt.cookie.domain=

# PostgreSQL Full-Text Search
app.search.use-fts=true

# Logging
# Keep broad controller/service logging at INFO; raise a specific class to DEBUG
# temporarily during investigation (e.g. logging.level.dev.catananti.service.AuthService=DEBUG).
logging.level.root=INFO
logging.level.dev.catananti=INFO
logging.level.dev.catananti.controller=INFO
logging.level.dev.catananti.service=INFO
logging.level.io.netty.util.ResourceLeakDetector=OFF

# CORS — allow frontend via nginx on port 80 and dev server on port 4200
cors.allowed-origins=http://192.168.1.214,http://192.168.1.214:4200,http://localhost,http://localhost:4200,http://default-server

# Scheduling
scheduling.refresh-token-cleanup-ms=3600000
scheduling.password-reset-cleanup-ms=21600000
scheduling.metrics-update-ms=60000
app.scheduler.article-publish-rate=60000
cache.warming.refresh-rate-ms=300000
cache.warming.enabled=true

# Swagger UI
springdoc.swagger-ui.enabled=true

# CSRF — double-submit cookie pattern; required for state-changing requests
security.csrf.enabled=true

# reCAPTCHA — enforced on auth endpoints in cluster/prod
recaptcha.enabled=true

# Actuator
# SEG-9: env/loggers omitted — /actuator/env can render JWT secret, DB/Redis passwords and API keys (defense-in-depth, even ADMIN-gated).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.health.mail.enabled=false

# Admin credentials
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
admin.name=${ADMIN_NAME}
admin.user.initialization.enabled=true

# Contact form
app.contact.notification-email=${CONTACT_NOTIFICATION_EMAIL:dev@localhost}

# DeepL
deepl.api-key=${DEEPL_API_KEY:}

# Datadog
management.datadog.metrics.export.enabled=${DD_METRICS_ENABLED:true}
management.datadog.metrics.export.api-key=${DD_API_KEY}
management.datadog.metrics.export.uri=${DD_METRICS_URI:https://api.us5.datadoghq.com}
management.datadog.metrics.export.step=30s

# Media Storage — Cloudflare R2 (S3-compatible)
app.storage.type=s3
app.storage.s3.endpoint=${S3_ENDPOINT}
app.storage.s3.region=${S3_REGION:auto}
app.storage.s3.bucket=${S3_BUCKET:catananti-assets}
app.storage.s3.access-key=${S3_ACCESS_KEY}
app.storage.s3.secret-key=${S3_SECRET_KEY}
app.storage.s3.public-url=${S3_PUBLIC_URL:/cdn}

# Site URL
app.site-url=http://192.168.1.214

# GeoIP database path
geoip.database.path=${GEOIP_DATABASE_PATH:/data/geolite2/GeoLite2-Country.mmdb}
