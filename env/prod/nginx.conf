worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # BUG-08: Hide server version in responses
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    # Note: X-Frame-Options is managed by Spring Security (set to DENY)
    # BUG-09: Duplicate X-Content-Type-Options, X-XSS-Protection, and Referrer-Policy
    # are not set here — they come from the Spring Boot backend.

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ============================================
    # Site config — catananti.dev
    # SSL termination via Let's Encrypt
    # ============================================

    upstream backend {
        # max_fails/fail_timeout let nginx briefly mark the single app container as
        # down during a deploy recreate instead of returning errors to clients.
        server app:8080 max_fails=3 fail_timeout=10s;
    }

    upstream frontend {
        server frontend:4000;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name catananti.dev www.catananti.dev;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # www -> non-www
    server {
        listen 443 ssl http2;
        server_name www.catananti.dev;

        ssl_certificate /etc/letsencrypt/cloudflare/catananti.dev.pem;
        ssl_certificate_key /etc/letsencrypt/cloudflare/catananti.dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://catananti.dev$request_uri;
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name catananti.dev;

        ssl_certificate /etc/letsencrypt/cloudflare/catananti.dev.pem;
        ssl_certificate_key /etc/letsencrypt/cloudflare/catananti.dev.key;
        ssl_trusted_certificate /etc/letsencrypt/cloudflare/catananti.dev.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Disable TLS session tickets: ticket keys, if not rotated frequently,
        # undermine forward secrecy. Session resumption still works via the
        # session cache above.
        ssl_session_tickets off;

        # OCSP stapling so clients don't make a separate request to the CA
        # (latency win + privacy: the user's IP isn't observed by Let's Encrypt).
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # HSTS is set here (TLS-level, not in the backend response).
        # X-Content-Type-Options and Referrer-Policy come from Spring Security
        # on proxied responses, so we do not duplicate them at the nginx layer
        # to avoid double-header values.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Defence-in-depth headers at the edge. CSP itself is set per-response
        # by the backend's CspNonceFilter so the nonce can be route-specific;
        # we don't duplicate it here.
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "interest-cohort=(), browsing-topics=(), geolocation=(), microphone=(), camera=()" always;

        # API Proxy
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            # Survive the brief swap window when the single app container is recreated
            # during a deploy: retry idempotent requests against the upstream as it
            # comes back up instead of surfacing 502/503/504 to clients.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 15s;
        }

        # Login rate limit (5r/m)
        location /api/v1/admin/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Actuator (restricted)
        location /actuator/ {
            auth_basic "Monitoring";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # RSS and Sitemap. The API serves the feed at BOTH /rss.xml and /feed.xml
        # (RssFeedController); the frontend footer links /feed.xml — without this
        # location it falls through to the SPA and renders the app's 404 page.
        location = /rss.xml {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location = /feed.xml {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location = /sitemap.xml {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # SECURITY: Block sensitive paths from CDN proxy
        location /cdn/backups/ { return 403; }
        location /cdn/private/ { return 403; }

        # CDN Proxy (Cloudflare R2 — avatars, media only)
        location /cdn/ {
            proxy_pass https://cdn.catananti.dev/;
            proxy_set_header Host cdn.catananti.dev;
            proxy_set_header Referer "";
            proxy_ssl_server_name on;
            proxy_cache_valid 200 30d;
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Frontend (Angular SPA)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
