global:
  resolve_timeout: 5m

route:
  receiver: 'null'
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers:
        - severity =~ "critical|warning"
      receiver: 'webhook'

receivers:
  # Default sink used when no Discord/Slack/email is wired up. Alerts still
  # fire and are visible in the AlertManager UI; they just don't notify out.
  - name: 'null'

  # Webhook receiver — point the URL at Discord/Slack/etc.
  # (Discord requires the ?wait=true query string in the URL.)
  # NOTE: Alertmanager does NOT expand environment variables in its config
  # file, so this must be a literal URL. To override: edit this file and
  # `docker compose restart alertmanager` (or bind-mount a rendered copy over
  # /etc/alertmanager/alertmanager.yml in a compose override file).
  - name: 'webhook'
    webhook_configs:
      - url: 'http://localhost:5001/'
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'instance']
