global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

# Alerting — AlertManager target. The compose stack is expected to provide an
# `alertmanager` service on port 9093; if not running, scrape will fail without
# affecting Prometheus itself, but alerts will not be delivered.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s
      scheme: http

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Portfolio Blog API
  - job_name: 'portfolio-blog-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
    scrape_interval: 10s
    scrape_timeout: 5s
    # No auth needed: Prometheus scrapes directly within Docker network
    # External access is protected by nginx basic auth

  # Node Exporter — host-level metrics. Scraped once the node-exporter
  # service is added to the compose stack (see env/dev/docker-compose.yml).
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # Nginx Exporter — HTTP traffic metrics from stub_status. Requires the
  # exporter sidecar and the nginx server to expose /stub_status on an
  # internal endpoint; left commented until both pieces are wired in.
  # - job_name: 'nginx'
  #   static_configs:
  #     - targets: ['nginx-exporter:9113']

  # Redis Metrics (optional - requires redis_exporter)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
