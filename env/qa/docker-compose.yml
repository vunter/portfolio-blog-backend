# ============================================
# QA Environment
# Infraestrutura (Postgres, Redis, frontend, nginx) externa no K3s caseiro.
# Compose sobe apenas o app Java + datadog-agent.
# Segredos via Doppler: doppler run --config qa -- docker compose up -d
# ============================================

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: portfolio-blog-api:qa
    container_name: portfolio-blog-api
    environment:
      - SPRING_PROFILES_ACTIVE=qa
      # Database — Postgres externo no K3s (base separada blog_qa)
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DB_USERNAME}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      # Redis — externo no K3s
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT:-6379}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_CACHE_TYPE=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_COOKIE_SECURE=${JWT_COOKIE_SECURE:-true}
      - JWT_COOKIE_DOMAIN=${JWT_COOKIE_DOMAIN:-}
      # CORS — AUD19C-6: `:-` fallback so an EMPTY Doppler var doesn't inject a blank
      # value (empty beats file default). QA has no dedicated public origin documented,
      # so the prod origins are used as the safe fallback; override via Doppler `qa`.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://catananti.dev,https://www.catananti.dev}
      # Admin
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_NAME=${ADMIN_NAME:-Administrator}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # reCAPTCHA
      - RECAPTCHA_ENABLED=${RECAPTCHA_ENABLED:-false}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY:-}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY:-}
      # Email
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-noreply@qa.local}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Portfolio QA}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-smtp}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CONTACT_NOTIFICATION_EMAIL=${CONTACT_NOTIFICATION_EMAIL:-}
      - EMAIL_SUPPORT=${EMAIL_SUPPORT:-}
      - MANAGEMENT_HEALTH_MAIL_ENABLED=${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      # App URLs
      - APP_URL=${APP_URL}
      - APP_SITE_URL=${APP_SITE_URL}
      # Datadog APM
      - DD_AGENT_ENABLED=${DD_AGENT_ENABLED:-true}
      - DD_AGENT_HOST=datadog-agent
      - DD_TRACE_AGENT_URL=http://datadog-agent:8126
      - DD_SERVICE=portfolio-blog-api
      - DD_ENV=qa
      - DD_VERSION=${DD_VERSION:-2.0.0}
      - DD_LOGS_INJECTION=true
      - DD_PROFILING_ENABLED=false
      - DD_METRICS_ENABLED=true
      - DD_API_KEY=${DD_API_KEY}
      # Sentry
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=qa
      # Translation, MFA, OAuth
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - MFA_ENCRYPTION_KEY=${MFA_ENCRYPTION_KEY}
      - OAUTH2_GITHUB_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - OAUTH2_GITHUB_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-}
      - OAUTH2_GOOGLE_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - OAUTH2_GOOGLE_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - OAUTH2_LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID:-}
      - OAUTH2_LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET:-}
      - OAUTH2_REDIRECT_BASE_URL=${OAUTH2_REDIRECT_BASE_URL:-}
      # Storage — Cloudflare R2 (bucket separado ou prefix qa/)
      - STORAGE_TYPE=${STORAGE_TYPE:-s3}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION:-auto}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      # Snowflake — distinct from prod (1)
      - SNOWFLAKE_NODE_ID=${SNOWFLAKE_NODE_ID:-2}
      # GeoIP — opcional em QA
      - GEOIP_DATABASE_PATH=/data/geolite2/GeoLite2-Country.mmdb
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    volumes:
      - uploads_data:/app/uploads
      - app_logs:/app/logs
      # GeoIP (opcional — comente se não existir no host de QA)
      # - /home/vunter/geolite2:/data/geolite2:ro
    networks:
      - blog-app-network
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    labels:
      com.datadoghq.ad.logs: '[{"source":"java","service":"portfolio-blog-api"}]'

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: datadog-agent
    pid: host
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-us5.datadoghq.com}
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE="name:datadog-agent"
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_TAGS=env:qa,service:portfolio-blog,team:catananti
      - DD_HOSTNAME=${DD_HOSTNAME:-qa-host}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - blog-app-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  blog-app-network:
    driver: bridge

volumes:
  uploads_data:
  app_logs:
